<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="350" fill="#f0fdf4" />
  
  <!-- Browser Frame -->
  <rect x="30" y="25" width="540" height="300" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" />
  <rect x="30" y="25" width="540" height="32" rx="10" fill="#f0fdf4" />
  <circle cx="50" cy="41" r="5" fill="#ef4444" />
  <circle cx="65" cy="41" r="5" fill="#f59e0b" />
  <circle cx="80" cy="41" r="5" fill="#10b981" />
  <rect x="110" y="33" width="240" height="16" rx="8" fill="#dcfce7" />

  <!-- Weather Hero Display -->
  <rect x="45" y="70" width="300" height="110" rx="8" fill="url(#p4Grad)" />
  <text x="65" y="95" font-family="sans-serif" font-size="13" font-weight="600" fill="#dcfce7">San Francisco, CA</text>
  <text x="65" y="145" font-family="sans-serif" font-size="42" font-weight="bold" fill="#ffffff">68°F</text>
  <text x="175" y="140" font-family="sans-serif" font-size="14" fill="#ffffff">Partly Cloudy ⛅</text>
  <text x="65" y="165" font-family="sans-serif" font-size="11" fill="#dcfce7">Humidity: 62%  |  Wind: 8 mph</text>

  <!-- Metric Widget 1 -->
  <rect x="360" y="70" width="95" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="375" y="95" font-family="sans-serif" font-size="11" fill="#64748b">UV Index</text>
  <text x="375" y="130" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1e293b">3</text>
  <text x="375" y="155" font-family="sans-serif" font-size="10" fill="#10b981">Moderate</text>

  <!-- Metric Widget 2 -->
  <rect x="465" y="70" width="90" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="475" y="95" font-family="sans-serif" font-size="11" fill="#64748b">Air Quality</text>
  <text x="475" y="130" font-family="sans-serif" font-size="22" font-weight="bold" fill="#10b981">92</text>
  <text x="475" y="155" font-family="sans-serif" font-size="10" fill="#10b981">Good</text>

  <!-- 5-Day Forecast Strip -->
  <rect x="45" y="195" width="510" height="115" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="60" y="215" font-family="sans-serif" font-size="11" font-weight="bold" fill="#475569">5-DAY FORECAST</text>

  <g transform="translate(60, 225)">
    <text x="15" y="20" font-family="sans-serif" font-size="11" fill="#1e293b">Mon</text>
    <text x="15" y="45" font-size="18">☀️</text>
    <text x="15" y="70" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b">72° / 55°</text>

    <text x="110" y="20" font-family="sans-serif" font-size="11" fill="#1e293b">Tue</text>
    <text x="110" y="45" font-size="18">⛅</text>
    <text x="110" y="70" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b">68° / 53°</text>

    <text x="205" y="20" font-family="sans-serif" font-size="11" fill="#1e293b">Wed</text>
    <text x="205" y="45" font-size="18">🌧️</text>
    <text x="205" y="70" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b">61° / 49°</text>

    <text x="300" y="20" font-family="sans-serif" font-size="11" fill="#1e293b">Thu</text>
    <text x="300" y="45" font-size="18">🌦️</text>
    <text x="300" y="70" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b">64° / 50°</text>

    <text x="395" y="20" font-family="sans-serif" font-size="11" fill="#1e293b">Fri</text>
    <text x="395" y="45" font-size="18">☀️</text>
    <text x="395" y="70" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b">70° / 54°</text>
  </g>
</svg>
