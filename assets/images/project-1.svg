<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="350" fill="#f1f5f9" />
  
  <!-- Browser Window Frame -->
  <rect x="30" y="25" width="540" height="300" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
  <!-- Browser Chrome Bar -->
  <rect x="30" y="25" width="540" height="32" rx="10" fill="#f8fafc" />
  <circle cx="50" cy="41" r="5" fill="#ef4444" />
  <circle cx="65" cy="41" r="5" fill="#f59e0b" />
  <circle cx="80" cy="41" r="5" fill="#10b981" />
  <rect x="110" y="33" width="300" height="16" rx="8" fill="#e2e8f0" />
  
  <!-- Banner -->
  <rect x="50" y="75" width="500" height="90" rx="8" fill="url(#p1Grad)" />
  <text x="75" y="115" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Nova Shop — Next-Gen Marketplace</text>
  <text x="75" y="140" font-family="sans-serif" font-size="12" fill="#e0e7ff">Curated Electronics &amp; Accessories with Fast Checkout</text>

  <!-- Product Cards Grid -->
  <!-- Card 1 -->
  <rect x="50" y="180" width="150" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
  <rect x="65" y="195" width="120" height="50" rx="4" fill="#e2e8f0" />
  <text x="65" y="260" font-family="sans-serif" font-size="11" font-weight="600" fill="#1e293b">Wireless Earbuds</text>
  <text x="65" y="278" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4f46e5">$79.99</text>
  
  <!-- Card 2 -->
  <rect x="225" y="180" width="150" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
  <rect x="240" y="195" width="120" height="50" rx="4" fill="#e2e8f0" />
  <text x="240" y="260" font-family="sans-serif" font-size="11" font-weight="600" fill="#1e293b">Mechanical Keyboard</text>
  <text x="240" y="278" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4f46e5">$129.00</text>

  <!-- Card 3 -->
  <rect x="400" y="180" width="150" height="120" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
  <rect x="415" y="195" width="120" height="50" rx="4" fill="#e2e8f0" />
  <text x="415" y="260" font-family="sans-serif" font-size="11" font-weight="600" fill="#1e293b">Smart Watch Series</text>
  <text x="415" y="278" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4f46e5">$199.99</text>
</svg>
